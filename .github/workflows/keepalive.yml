name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --max-time 25 "https://obunachi-birja.onrender.com/api/health" && echo "OK" || echo "ping failed"